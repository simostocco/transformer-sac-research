[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "transformer-sac-streaming-research"
version = "0.1.0"
description = "Causal forecasting, signed-Beta SAC and bounded streaming inference research"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "licenses/NUMPY-BSD-3-Clause.txt"]
requires-python = ">=3.11,<3.14"
dependencies = ["numpy==2.2.6", "pandas>=2.3.3,<3", "torch>=2.15,<2.16"]

[project.optional-dependencies]
test = ["pytest>=9.2,<10"]
parquet = ["pyarrow>=26.0.1,<27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

